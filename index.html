async function saveS(){const n={biz:$('#sb').value.trim(),industry:$('#si').value.trim(),email:$('#se').value.trim(),phone:$('#sp').value.trim(),rules:{}};if(!okE(n.email)||!okP(n.phone))return toast('Check your contact email/phone.');document.querySelectorAll('[data-r]').forEach(i=>n.rules[i.dataset.r]=Math.min(60,Math.max(1,+i.value||1)));S={...S,...n};SS[ws]=S;try{await db.collection(base).doc(sid()).set(S);if(n.biz){W.list=W.list.map(w=>w.id===ws?{...w,name:n.biz}:w);await db.collection(base).doc('workspaces').set(W)}toast('Settings saved')}catch(e){toast('Save failed: '+(e.message||e.code))}}
